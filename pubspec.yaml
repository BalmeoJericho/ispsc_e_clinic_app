name: ispsc_eclinic_app
description: ISPSC E-Clinic App - Medical Staff Only
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0

  # Camera & OCR
  camera: ^0.11.0+1
  google_mlkit_text_recognition: ^0.13.0

  # Charts
  fl_chart: ^0.68.0

  # Excel Export
  excel: ^2.0.4

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Date Formatting
  intl: ^0.19.0

  # App Icon
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    - assets/school_logo.png
    - assets/clinic_bg.jpg
    - assets/ISPSC.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ISPSC.jpg"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/ISPSC.jpg"